html,body{height:auto;min-height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--f-body);font-size:14px;
  background:
    radial-gradient(rgba(255,214,120,.32) 1.3px,transparent 1.7px) 0 0/7px 7px,
    linear-gradient(140deg,#e4471f,#c2231a 60%,#a81b14);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px 28px}

/* ---------- 공통 버튼 ---------- */
.btn{border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:800;font-size:13px;
  padding:7px 12px;border-radius:8px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn:focus-visible,.slot:focus-visible,.chip:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn.go{background:var(--red);color:var(--white)}
.btn.v{background:var(--ink);color:var(--yel)}
.btn.blue{background:var(--blue);color:var(--white)}
.btn.sm{font-size:12px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink)}
.btn.sel{background:var(--yel)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- 상단 바 ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--paper);border:3px solid var(--ink);
  border-radius:10px;padding:8px 12px;box-shadow:4px 4px 0 var(--ink);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-family:var(--f-disp);font-size:20px;color:var(--red);transform:skew(-8deg);cursor:pointer;
  text-shadow:2px 2px 0 var(--ink);letter-spacing:.5px;background:none;border:0;padding:0}
.phase{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.rnd{font-family:var(--f-num);font-size:20px;letter-spacing:1px}
.phs{font-family:var(--f-disp);font-size:14px;padding:3px 10px;border-radius:999px;border:2px solid var(--ink)}
.phs.player{background:var(--blue-l)}
.phs.villain{background:var(--yel)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#c2231a}

/* ---------- 구역 패널 ---------- */
.panel{border:3px solid var(--ink);border-radius:12px;padding:14px;position:relative}
.panel h2{font-family:var(--f-disp);font-weight:400;margin:0 0 8px;font-size:22px;line-height:1;transform:skew(-8deg);display:inline-block}
.villain-area{background:radial-gradient(rgba(232,179,28,.45) 1.2px,transparent 1.6px) 0 0/6px 6px,var(--yel);box-shadow:6px 6px 0 var(--red-d)}
.villain-area h2{color:var(--red-d)}
.player-area{background:radial-gradient(rgba(58,109,181,.25) 1.2px,transparent 1.6px) 0 0/6px 6px,var(--blue-l);box-shadow:6px 6px 0 var(--navy)}
.player-area h2{color:var(--white);text-shadow:2px 2px 0 var(--navy)}
.zones{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-start}
.zone{display:flex;flex-direction:column;gap:6px;min-width:0}
.zone.grow{flex:1 1 220px}
.zlabel{font-family:var(--f-disp);font-size:13px;letter-spacing:.3px;transform:skew(-8deg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;min-height:calc(var(--cw)*1.4)}
.row.empty::after{content:attr(data-empty);font-size:12px;color:var(--muted);align-self:center;font-style:italic}
.player-area .row.empty::after{color:var(--navy)}
.pair{display:flex;gap:10px;align-items:flex-start}

/* ---------- 카드 ---------- */
.slot{position:relative;width:var(--cw);aspect-ratio:63/88;flex:none;cursor:pointer;border:0;padding:0;background:none}
.slot.land{width:calc(var(--cw)*1.4);aspect-ratio:88/63}
.slot.ex:not(.land){width:calc(var(--cw)*1.4);aspect-ratio:88/63}
.face{position:absolute;inset:0;border-radius:7px;overflow:hidden;border:2px solid var(--ink);background:var(--white);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.slot.ex:not(.land) .face{inset:auto;width:calc(var(--cw));height:calc(var(--cw)*88/63);left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
.slot.ex.land .face{transform:rotate(90deg) scale(.72)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:5px;
  background:var(--pc,#ddd);color:var(--pt,#111);text-align:left}
.ph b{font-size:10px;line-height:1.15;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}
.ph small{font-size:8px;opacity:.85;line-height:1.1}
.ph .side{position:absolute;right:4px;top:3px;font-family:var(--f-num);font-size:12px}
.ph::after{content:"";position:absolute;left:5px;right:5px;top:44%;height:26%;border:1.5px dashed currentColor;opacity:.35;border-radius:4px}
.back{position:absolute;inset:0;display:grid;place-items:center}
.back.p{background:radial-gradient(circle at 50% 50%,#5a8ad0 0 18%,transparent 19%),repeating-linear-gradient(45deg,#24488a 0 6px,#2d5598 6px 12px)}
.back.e{background:radial-gradient(circle at 50% 50%,#ffb04a 0 18%,transparent 19%),repeating-linear-gradient(45deg,#c95a14 0 6px,#d96a1d 6px 12px)}
.back::before{content:"★";font-size:calc(var(--cw)*.3);color:var(--white);text-shadow:2px 2px 0 var(--ink)}
.cnt-badge{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--ink);color:var(--white);
  font-family:var(--f-num);font-size:14px;padding:1px 8px;border-radius:999px;letter-spacing:1px;z-index:3}
.pile-empty{position:absolute;inset:0;border:2px dashed var(--ink);border-radius:7px;opacity:.35}

/* ---------- 토큰 (룰북 구성품 모양) ---------- */
.toks{position:absolute;right:-7px;top:-7px;display:flex;flex-direction:column;gap:3px;z-index:4;align-items:flex-end}
.tk{font-family:var(--f-num);font-size:15px;min-width:25px;height:25px;display:inline-grid;place-items:center;color:var(--white);letter-spacing:.5px;line-height:1}
.tk.dmg{border-radius:50%;background:radial-gradient(circle at 35% 30%,#e5482f,#7a0f09 70%);border:2px solid #1a0805;box-shadow:inset 0 0 0 2px #f4c08a}
.tk.thr{width:31px;height:27px;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.tk.thr::before{content:"";position:absolute;inset:4px 4px 2px;background:linear-gradient(#ffd83c,#f08a1c);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tk.thr i{position:relative;font-style:normal;color:var(--ink);padding-top:9px;font-size:14px}
.tk.cnt{border-radius:7px;background:linear-gradient(#69c96f,#2c8a42);border:2px solid var(--ink)}
.tk.acc{width:30px;height:28px;background:var(--ink);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);position:relative}
.tk.acc::before{content:"";position:absolute;inset:3px;background:linear-gradient(#ff9a3c,#a53bb0);clip-path:inherit}
.tk.acc i{position:relative;font-style:normal;font-size:14px}
.sts{position:absolute;left:3px;bottom:3px;display:flex;flex-direction:column;gap:2px;z-index:3}
.st{font-size:9px;font-weight:800;padding:1px 4px;border:1.5px solid var(--ink);border-radius:3px;color:var(--ink);line-height:1.3}
.st.stun{background:#a6dc52}.st.conf{background:#c19ae6}.st.tough{background:#f7ab45}
.fpt{display:inline-grid;place-items:center;width:44px;height:34px;border-radius:50%;background:var(--white);border:3px solid var(--red);
  font-family:var(--f-num);color:var(--red);font-size:18px;letter-spacing:-1px;position:relative;box-shadow:0 0 0 2px var(--ink)}
.fpt::after{content:"";position:absolute;left:6px;bottom:-7px;border:6px solid transparent;border-top-color:var(--red);transform:rotate(25deg)}
.fpt.sm{width:30px;height:23px;font-size:13px;border-width:2px}

/* ---------- 생명력 다이얼 ---------- */
.dial{display:inline-flex;align-items:center;gap:4px}
.dial .win{display:flex;gap:3px;padding:6px 14px;border-radius:999px;border:2px solid var(--ink);
  background:radial-gradient(ellipse at 50% 40%,#f06b3a,#b8331c 70%)}
.dial.v .win{background:radial-gradient(ellipse at 50% 40%,#4a4c55,#15161c 70%);box-shadow:inset 0 0 0 3px #c82a20}
.dial .win span{font-family:var(--f-num);font-size:21px;background:#e1ecf7;color:#0b2140;border-radius:5px;min-width:19px;text-align:center;border:2px solid #0b2140;line-height:1.25}
.dial.v .win span{background:var(--white);color:var(--red)}
.dial button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:800;font-size:16px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.dial button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.dial.sm .win{padding:3px 9px}.dial.sm .win span{font-size:16px;min-width:15px}

/* ---------- 손패 ---------- */
.hand{background:var(--navy);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;box-shadow:6px 6px 0 rgba(0,0,0,.5)}
.hand h2{color:var(--yel);font-family:var(--f-disp);font-weight:400;margin:0 0 10px;font-size:18px;transform:skew(-8deg);display:inline-block}
.hand-row{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;--cw:clamp(70px,8.2vw,108px)}
.hand-row .slot{--cw:inherit}
.hand .muted{color:#c9d4ec}

/* ---------- 플레이어 탭 ---------- */
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:800;box-shadow:2px 2px 0 var(--ink)}
.chip.on{background:var(--blue);color:var(--white)}
.chip .hp{font-family:var(--f-num);font-size:16px;letter-spacing:1px}

/* ---------- 배너 ---------- */
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--white);border:3px solid var(--ink);border-radius:10px;padding:8px 12px;margin-bottom:10px;box-shadow:3px 3px 0 var(--ink)}
.banner b{font-family:var(--f-disp);font-weight:400;font-size:17px;color:var(--red)}

/* ---------- 시트(아래에서 올라오는 창) ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
[hidden]{display:none!important}
#sheet .scrim{position:absolute;inset:0;background:rgba(20,10,10,.55)}
#sheet .panel2{position:relative;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:16px 16px 0 0;
  width:min(820px,100%);max-height:88%;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 0 var(--ink)}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sh-head h3{font-family:var(--f-disp);font-weight:400;font-size:21px;margin:0;transform:skew(-6deg);color:var(--red);text-wrap:balance}
.cs{display:flex;gap:16px;flex-wrap:wrap}
.cs-img{--cw:min(220px,46vw);flex:none}
.cs-img.land{--cw:min(200px,38vw)}
.cs-body{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.sub{color:var(--muted);font-size:12px;margin:0}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl > span:first-child{font-weight:800;font-size:12px;min-width:56px}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);background:var(--white);font-weight:800;cursor:pointer}
.step output{font-family:var(--f-num);font-size:20px;min-width:28px;text-align:center}
.sec{border-top:2px dashed rgba(26,28,41,.25);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:12px;letter-spacing:.5px;color:var(--muted)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600}
.fld input,.fld select{font:inherit;font-size:14px;padding:6px 8px;border:2px solid var(--ink);border-radius:7px;background:var(--white);min-width:0}
.fld.need input{border-color:var(--red);background:#fff1ee}
.note{font-size:12.5px;background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;line-height:1.55}
.big-num{font-family:var(--f-num);font-size:34px;letter-spacing:1px;line-height:1}

/* ---------- 시작 / 세팅 / 보관함 ---------- */
.hero{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:22px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px}
.title{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,7vw,62px);margin:0;line-height:1;color:var(--red);transform:skew(-8deg);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.lead{margin:0;max-width:62ch;line-height:1.6}
.card-box{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:16px;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.card-box h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:18px;transform:skew(-6deg)}
.pcfg{border:2px solid var(--ink);border-radius:10px;padding:10px;background:var(--white);display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.lib-set{display:flex;flex-direction:column;gap:8px}
.lib-set h3{margin:6px 0 0;font-family:var(--f-disp);font-weight:400;font-size:16px;color:var(--white);text-shadow:2px 2px 0 var(--ink);transform:skew(-6deg)}
.lib-grid{display:flex;flex-wrap:wrap;gap:12px}
.lib-item{display:flex;flex-direction:column;gap:4px;width:var(--cw);--cw:clamp(70px,9vw,100px)}
.lib-item.land{width:calc(var(--cw)*1.4)}
.lib-item span{font-size:10.5px;color:var(--white);line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;text-shadow:1px 1px 0 var(--ink)}
.lib-item .ok{position:absolute;left:-5px;top:-5px;z-index:4;width:18px;height:18px;border-radius:50%;background:var(--green);border:2px solid var(--ink);color:var(--white);font-size:11px;display:grid;place-items:center}
.progress{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}
textarea{width:100%;min-height:200px;font:12px ui-monospace,Menlo,monospace;border:2px solid var(--ink);border-radius:8px;padding:8px;box-sizing:border-box}

.ctext{background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctext p{margin:0;flex-basis:100%;font-size:13px;line-height:1.6}
.cost{font-family:var(--f-num);font-size:19px;background:var(--red);color:var(--white);border:2px solid var(--ink);border-radius:6px;min-width:26px;text-align:center;line-height:1.2}
.res{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);white-space:nowrap}
.res.m{background:#4f86d1;color:#fff}.res.p{background:#d8463b;color:#fff}.res.e{background:#f2c418;color:#1a1c29}.res.w{background:#2f9e4f;color:#fff}
.paycard{display:flex;flex-direction:column;align-items:center;gap:5px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--yel);
  padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px;max-width:90vw;text-align:center;box-shadow:3px 3px 0 var(--red)}
.over{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:20px}
.over .hero{max-width:520px;align-items:flex-start}

@media (max-width:700px){
  :root{--cw:54px}
  .panel{padding:10px}
  .bar{gap:8px}
  .rnd{font-size:17px}
}

/* =========== 테이블 개편: 네이비 플레이매트 =========== */
:root{--mat:#16233f;--line:rgba(255,255,255,.24);--soft:#cfd8ea;--hcw:clamp(84px,9.4vw,118px)}
body{background:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px) 0 0/9px 9px,var(--mat);background-attachment:fixed}
body::before{background:#c2231a}
body.ingame{padding-bottom:calc(var(--hcw)*1.4*.62 + 30px)}
.btn.yel{background:var(--yel);color:var(--ink)}
.bar{background:#c2231a;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);gap:8px 12px}
.bar .brand{color:#fff;text-shadow:2px 2px 0 var(--ink)}
.bar .rnd{font-family:var(--f-num);font-size:18px;background:var(--yel);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;letter-spacing:1px}
.bar .phs{background:#fff}
.bar .phs.villain{background:var(--ink);color:var(--yel)}
.bar .sp{flex:1}
.mz{position:relative;border:2px dashed var(--line);border-radius:14px;padding:18px 14px 12px;color:#fff}
.mz>.zl{position:absolute;top:-11px;left:14px;background:var(--mat);padding:0 8px;font:900 12.5px var(--f-body);color:var(--yel);letter-spacing:.03em;white-space:nowrap}
.mz .banner{color:var(--ink)}
.mz .sub{color:var(--soft)}
.cap{font:800 11.5px var(--f-body);color:var(--yel);white-space:nowrap;display:flex;align-items:center;gap:6px}
.cap em{font-style:normal;font-weight:600;color:var(--soft)}
.zcol{display:flex;flex-direction:column;gap:7px;min-width:0}
.zcol.grow{flex:1 1 200px}
.vrow{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-start}
.row{min-height:calc(var(--cw)*1.4)}
.row.empty::after,.player-area .row.empty::after{color:rgba(255,255,255,.45)}
.ez .row{min-height:0}
.ez .row.empty{min-height:24px}
.row.stack .slot{--cw:clamp(46px,5vw,64px)}
.dwrap{position:relative;display:inline-flex}
.delta{position:absolute;right:-6px;top:-18px;font:400 22px var(--f-num);letter-spacing:1px;pointer-events:none;text-shadow:2px 2px 0 var(--ink);animation:dl 1.6s ease-out forwards;z-index:6}
.delta.up{color:#ff6b57}.delta.dn{color:#7ee081}
@keyframes dl{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
/* 주요 음모 + 위협 게이지 */
.schwrap{position:relative;display:inline-block;align-self:flex-start}
.bigthr{position:absolute;right:-12px;top:-12px;z-index:5}
.bigthr .tk.thr{width:44px;height:38px;font-size:20px}
.bigthr .tk.thr i{padding-top:12px;font-size:19px}
.bigthr.hot .tk.thr{animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{transform:scale(1.12);filter:drop-shadow(0 0 6px #ff3b2f)}}
.gauge{display:flex;align-items:center;gap:8px;width:calc(var(--cw)*1.75)}
.gbar{position:relative;flex:1;height:12px;border:2px solid var(--ink);border-radius:999px;background:#0c1528;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:#3d8bfd;transition:width .4s}
.gauge.warm .gbar i{background:#ef7c21}.gauge.hot .gbar i{background:#e3342a}
.gbar b{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 4px,rgba(255,255,255,.12) 4px 8px)}
.gnum{font:400 17px var(--f-num);letter-spacing:1px;white-space:nowrap}
.gauge.hot .gnum{color:#ff6b57}
.gctl{display:flex;gap:8px;align-items:center}
.gctl .step button{width:26px;height:26px}
.pred{font-size:11px;color:var(--soft);line-height:1.35}
.pred b{color:#fff;font-family:var(--f-num);font-size:15px;letter-spacing:1px;font-weight:400}
.pred small{font-size:10px;opacity:.85}
.badges{display:flex;gap:5px;flex-wrap:wrap;max-width:calc(var(--cw)*2)}
.bdg{font:800 10.5px var(--f-body);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;color:var(--ink)}
.bdg.acc{background:#d9a0ff}.bdg.cri{background:#ff8a7a}

const IMG=new Map();let db=null;let memOnly=false;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('mct-images',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadImgs(){
  try{db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('img','readonly');const rq=tx.objectStore('img').openCursor();
    rq.onsuccess=()=>{const c=rq.result;if(c){IMG.set(c.key,URL.createObjectURL(c.value));c.continue()}else res()};rq.onerror=()=>rej(rq.error)})}
  catch(e){memOnly=true}
}
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const s=Math.min(1,1000/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.88));
  }catch(e){return file}
}
async function putImg(key,file){
  const blob=await shrink(file);
  if(IMG.has(key))URL.revokeObjectURL(IMG.get(key));
  IMG.set(key,URL.createObjectURL(blob));
  if(db){try{await new Promise((res,rej)=>{const tx=db.transaction('img','readwrite');tx.objectStore('img').put(blob,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){memOnly=true}}
}
async function delImg(key){
  if(IMG.has(key)){URL.revokeObjectURL(IMG.get(key));IMG.delete(key)}

}

function newGame(cfg){
  G={n:1,I:{},N:cfg.players.length,round:1,phase:'player',first:0,view:0,P:[],enc:{deck:[],discard:[]},sides:[],removed:[],limbo:[],accel:0,

    SETS.find(x=>x.id===pc.hid).cards.forEach(cid=>{const c=C[cid];if(c.kind!=='identity'&&c.kind!=='obligation')add(cid)});

  hist=[];save();VIEW='game';render();openSheet(setupSheet);
}

      ${z&&/\.hand$/.test(z)?playBtn(iid):''}

      ${!c.enc&&z&&/\.play$/.test(z)&&(!cdOf(i.cid)||cdOf(i.cid).type==='동료')?`<div class="btns"><button class="btn sm go" data-act="allyUse" data-i="${iid}" data-t="atk" ${i.ex?'disabled':''}>동료로 공격 ${allyStat(iid,'atk')}</button><button class="btn sm blue" data-act="allyUse" data-i="${iid}" data-t="thw" ${i.ex?'disabled':''}>동료로 저지 ${allyStat(iid,'thw')}</button></div>`:''}
      ${z==='scheme'?'':stepper('tok',`data-i="${iid}" data-k="dmg"`,i.dmg,'피해')}
      ${stepper('tok',`data-i="${iid}" data-k="thr"`,i.thr,'위협')}
      ${stepper('tok',`data-i="${iid}" data-k="cnt"`,i.cnt,'카운터')}
      <div class="ctl"><span>상태</span><div class="btns">${[['stun','기절'],['conf','혼란'],['tough','강인함']].map(([k,l])=>`<button class="stbtn ${i.st[k]?'on':''}" data-act="stat" data-i="${iid}" data-k="${k}" aria-label="${l}${i.st[k]?' 해제':' 놓기'}" aria-pressed="${!!i.st[k]}"><span class="stc ${k}"></span></button>`).join('')}</div></div>
      ${moves.length?`<div class="sec"><h4>옮기기</h4><div class="btns">${moves.map(([d,l])=>`<button class="btn sm" data-act="mv" data-i="${iid}" data-to="${d}">${esc(l)}</button>`).join('')}</div></div>`:''}
      ${extra}${info}
    </div></div>`;
}}

function listSheet(title,arr,opts={}){return ()=>{
  const a=typeof arr==='function'?arr():arr;
  return head(title,opts.btns||'')+(opts.note?`<p class="note">${opts.note}</p>`:'')+(a.length?`<div class="row" style="padding-top:8px">${a.slice().reverse().map(i=>slot(i,{act:opts.act||'card'})).join('')}</div>`:'<p class="sub">카드가 없어요.</p>')}}

/* ---------- 세팅 마무리 (음모 1A → 1B, 멀리건) ---------- */
function setupSheet(){
  const st=G.setup;if(!st)return null;
  if(st.step==='scheme'){const i=G.I[G.sch.iid];
    return head('세팅 · 주요 음모')+`<div class="cs"><div class="cs-img land"><div class="slot land">${faceOf(i.cid,i.side)}</div></div><div class="cs-body">${cardText(i.cid,i.side)}
      <p class="note">주요 음모 ${i.side==='a'?'1A':'1B'} 면이에요. 1A 면의 도입부 문구와 <b>사전 준비</b> 지시를 읽고 처리한 뒤 1B 면으로 넘기세요.</p>
      <p class="sub">빌런 생명력 ${G.vill.hp} · 위협 임계점 ${schTarget()??'?'} · 시작 위협 ${G.sch.threat}</p>
      <div class="btns">${i.side==='a'?'<button class="btn go" data-act="setupFlip">1B 면으로 넘기기</button>':'<button class="btn go" data-act="setupNext">멀리건으로</button>'}</div></div></div>`}
  if(st.step==='mull'){const k=st.k;const p=G.P[k];
    return head(`멀리건 · ${esc(hn(k))}`)+`<p class="note">바꾸고 싶은 카드를 누르세요. 고른 카드는 버린 카드 더미로 가고, 같은 수만큼 새로 뽑아요. 버린 카드는 지금 덱에 섞지 않아요.</p>
      <div class="row" style="padding-top:8px">${p.hand.map(i=>slot(i,{act:'selCard',sel:UI.sel.has(i)})).join('')}</div>
      <div class="btns" style="margin-top:12px"><button class="btn go" data-act="mullDo">${UI.sel.size?`${UI.sel.size}장 바꾸고 다음`:'그대로 두고 다음'}</button></div>`}
  if(st.step==='done')return head('준비 완료')+`<p class="note">아이덴티티 카드에 <b>사전 준비</b> 지시가 있으면 지금 처리하세요. 그다음 시작 플레이어부터 턴을 진행하면 돼요.</p>${G.P.map((p,x)=>p.hid==='blackpanther'&&!(G.once||{})['bps'+x]?`<div class="btns"><button class="btn blue" data-act="bpSetup" data-k="${x}">T'Challa 선견지명: 블랙 팬서 업그레이드 찾기</button></div>`:'').join('')}<div class="btns"><button class="btn go" data-act="setupEnd">게임 시작</button></div>`;
  return null;
}

/* ---------- 플레이어 페이즈 끝내기 ---------- */
function endPlayerSheet(){
  const rows=G.P.map((p,k)=>{if(p.elim)return '';const over=p.hand.length-UI.sel.size*0;const size=hs(p);
    const selN=p.hand.filter(i=>UI.sel.has(i)).length;const left=p.hand.length-selN;
    return `<div class="sec"><h4>${esc(hn(k))} · 손패 ${p.hand.length}장 / 손 크기 ${size} (${p.form==='hero'?'히어로':'일상'})</h4>
      ${left>size?`<p class="note">손 크기를 넘어요. ${left-size}장을 더 골라 버려야 해요.</p>`:'<p class="sub">버리고 싶은 카드가 있으면 눌러서 고르세요. 없으면 그대로 진행하면 돼요.</p>'}
      <div class="row">${p.hand.map(i=>slot(i,{act:'selCard',sel:UI.sel.has(i)})).join('')}</div></div>`}).join('');
  const bad=G.P.some(p=>!p.elim&&p.hand.filter(i=>!UI.sel.has(i)).length>hs(p));
  return head('플레이어 페이즈 끝내기')+`<p class="note">1) 고른 카드를 버리고 2) 손 크기까지 뽑고 3) 모든 카드를 준비 상태로 세운 뒤 빌런 페이즈로 넘어가요.</p>${rows}
    <div class="btns" style="margin-top:12px"><button class="btn go" data-act="endPlayerDo" ${bad?'disabled':''}>정리하고 빌런 페이즈로</button></div>`;
}

/* ---------- 빌런 페이즈 진행 ---------- */
function vwSheet(){
  const w=G.vw;if(!w)return null;
  const steps=['위협 놓기','빌런과 하수인 활성화','조우 카드 나눠주기','조우 카드 공개하기','시작 플레이어 토큰 넘기기'];
  const prog=`<div class="seg" style="margin-bottom:10px">${steps.map((s,x)=>`<span class="btn sm ${w.step===x+1?'sel':''}" style="box-shadow:none;cursor:default">${x+1}. ${s}</span>`).join('')}</div>`;
  const hd=head('빌런 페이즈','<button class="btn sm" data-act="closeSheet">테이블 보기</button>').replace('<button class="btn sm" data-act="closeSheet">닫기</button>','');
  if(w.step===1){
    const sm=meta(scid());const base=(sm.accel??0)*N();const sideAcc=G.sides.filter(i=>meta(G.I[i].cid).accel).length;
    if(w.add==null)w.add=base+G.accel+sideAcc;
    return hd+prog+`<p class="note">주요 음모의 가속 수치만큼 위협을 놓아요. 가속 ${base} + 가속 토큰 ${G.accel} + 가속 아이콘 부가 음모 ${sideAcc}</p>
      ${stepper('vwAdd','',w.add,'놓을 위협')}<div class="btns"><button class="btn go" data-act="vw1">위협 ${w.add} 놓기</button></div>`}
  if(w.step===2){
    const k=w.order[w.oi];const p=G.P[k];const hero=p.form==='hero';const v=G.I[G.vill.iid];const vm=meta(vcid());
    let body=`<p class="note"><b>${esc(hn(k))}</b>은(는) ${hero?'히어로 형태라 빌런이 <b>공격</b>해요.':'일상 형태라 빌런이 <b>암약</b>을 꾸며요.'} (${w.oi+1}/${w.order.length}번째 활성화)</p>`;
    if(w.sub==='start'){
      if(hero)body+=`<div class="btns"><button class="btn go" data-act="vwAtk">빌런 공격 시작</button></div>`;
      else if(!hero&&v.st.conf)body+=`<p class="note">빌런이 <b>혼란</b> 상태예요. 암약 대신 혼란 카드를 버려요.</p><div class="btns"><button class="btn go" data-act="vwStatus" data-k="conf">혼란 카드 버리고 넘어가기</button></div>`;
      else if(hero&&webOn(G.vill.iid))body+=`<p class="note"><b>거미줄 포획</b>이 발동해요. 공격 대신 거미줄 포획을 버리고 빌런을 기절시켜요.</p><div class="btns"><button class="btn go" data-act="vwWeb">거미줄 포획 발동</button></div>`;
      else body+=`<div class="btns"><button class="btn go" data-act="vwBoost">강화 카드 받기</button></div>`;
    }
    if(w.sub==='defend'){
      const opts=[];G.P.forEach((q,x)=>{if(!q.elim&&q.form==='hero'&&!G.I[q.id].ex)opts.push([`h:${x}`,`${hn(x)} (DEF ${meta(HEROES[q.hid].identity).def??'?'})`])});
      G.P.forEach((q,x)=>q.play.forEach(i=>{const ii=G.I[i];if(!ii.ex)opts.push([`a:${i}`,`동료 ${nm(ii.cid)}`])}));
      body+=`<div class="row">${slot(w.boost,{down:true,act:'noop'})}</div><p class="sub">방어할 캐릭터를 고르면 소진돼요. 방어자가 히어로가면 피해가 DEF만큼 줄고, 동료이면 피해를 모두 받아요.</p>
        <div class="btns"><button class="btn" data-act="vwDef" data-v="none">방어하지 않기</button>${opts.map(([v2,l])=>`<button class="btn blue" data-act="vwDef" data-v="${v2}">${esc(l)}</button>`).join('')}</div>`;
    }
    if(w.sub==='reveal'){
      const bi=G.I[w.boost];
      if(!w.rv)body+=`<div class="row">${slot(w.boost,{down:true,act:'noop'})}</div><div class="btns"><button class="btn go" data-act="vwReveal">강화 카드 공개</button></div>`;
      else{
        const bm=meta(bi.cid);if(w.bst==null)w.bst=bm.boost??0;
        const baseV=hero?vAtk():vSch();const total=Math.max(0,baseV+w.bst+(w.mod||0));
        let dmg=total;let defNote='';
        if(hero){if(w.def&&w.def.startsWith('h:')){const dk=+w.def.slice(2);const dv=w.defv??(meta(HEROES[G.P[dk].hid].identity).def??0);w.defv=dv;dmg=Math.max(0,total-dv);defNote=`${hn(dk)}가 방어 (DEF ${dv})`}
          else if(w.def&&w.def.startsWith('a:'))defNote=`동료 ${nm(G.I[w.def.slice(2)].cid)}가 방어 — 피해를 모두 받아요`;else defNote=`방어 없음 — ${hn(k)}가 피해를 받아요`}
        if(w.fin==null||w.finAuto)w.fin=hero?dmg:total;
        body+=`<div class="cs"><div class="cs-img"><button class="slot" data-act="card" data-i="${w.boost}">${faceOf(bi.cid,bi.side)}</button></div><div class="cs-body">
          ${stepper('vwBst','',w.bst,'강화 아이콘')}
          <p class="sub">카드 오른쪽 아래 강화 아이콘 수예요. 바꾸면 이 카드에 기억돼요. 별 아이콘이 있으면 카드의 별 효과도 처리하세요.</p>
          ${stepper('vwMod','',w.mod||0,'추가 보정')}
          <p class="sub">빌런 ${hero?'ATK':'SCH'} ${baseV} + 강화 ${w.bst}${w.mod?` + 보정 ${w.mod}`:''} = ${total}${hero?` · ${defNote}`:''}</p>
          ${hero&&w.def&&w.def.startsWith('h:')?stepper('vwDefv','',w.defv,'방어력'):''}
          ${stepper('vwFin','',w.fin,hero?'받을 피해':'놓을 위협')}
          ${(()=>{if(!hero||w.prevented||(w.def&&w.def.startsWith('a:')))return '';const tk=w.def&&w.def.startsWith('h:')?+w.def.slice(2):k;return G.P[tk].hand.some(x=>G.I[x].cid==='spiderman-backflip')?`<div class="btns"><button class="btn v" data-act="vwBackflip" data-k="${tk}">${esc(hn(tk))}: 공중제비로 피해 모두 방지 (비용 0)</button></div>`:''})()}
          ${w.prevented?'<p class="sub">공중제비로 이번 공격의 피해를 모두 방지했어요.</p>':''}
          ${bi.cid==='spiderman-nem-sweeping-swoop'&&hero?'<p class="sub">★ 급강하 타격: 이번 활성화로 피해를 입은 캐릭터는 기절해요 (자동 처리).</p>':''}
          ${hero?'':schBtns('w')}
          <div class="btns"><button class="btn go" data-act="vwApply">${hero?`피해 ${w.fin} 주기`:`위협 ${w.fin} 놓기`}</button></div></div></div>`;

    if(w.sub==='minions'){

        return `<div class="pcfg"><div class="ctl"><span>${esc(en(i))}</span>${stepper('vwMv',`data-i="${i}"`,val,hero?'피해':'위협').replace(/<div class="ctl"><span>[^<]*<\/span>/,'<div class="ctl">')}
          <button class="btn sm go" data-act="vwMin" data-i="${i}">${hero?'공격 적용':'암약 적용'}</button>${hero&&p.hand.some(x=>G.I[x].cid==='spiderman-backflip')&&!mi.st.stun&&!webOn(i)?`<button class="btn sm v" data-act="vwMinFlip" data-i="${i}">공중제비로 방지</button>`:''}<button class="btn sm" data-act="vwMinSkip" data-i="${i}">건너뛰기</button></div>
          ${hero&&webOn(i)&&!mi.st.stun?'<p class="sub">거미줄 포획이 장착돼 있어 적용하면 공격 대신 카드를 버리고 하수인을 기절시켜요.</p>':''}
          ${(hero&&mi.st.stun)||(!hero&&mi.st.conf)?`<p class="sub">${hero?'기절':'혼란'} 상태라 적용하면 상태 카드만 버려요.</p>`:''}</div>`}).join('')
        :`<p class="sub">이 플레이어와 교전 중인 하수인 활성화가 끝났어요.</p>`;
      body+=`<div class="btns" style="margin-top:10px"><button class="btn go" data-act="vwNextP">${w.oi+1<w.order.length?'다음 플레이어 활성화':'조우 카드 나누기로'}</button></div>`;
    }
    return hd+prog+body;
  }
  if(w.step===3){
    const haz=G.sides.filter(i=>meta(G.I[i].cid).hazard).length;if(w.haz==null)w.haz=haz;
    return hd+prog+`<p class="note">플레이어마다 조우 카드 1장을 뒷면으로 나눠요. 수령 아이콘이 있는 부가 음모 1개당 1장씩 더, 시작 플레이어부터 차례로 나눠요.</p>
      ${stepper('vwHaz','',w.haz,'추가 카드(수령)')}<div class="btns"><button class="btn go" data-act="vw3">${w.order.length+w.haz}장 나누기</button></div>`}
  if(w.step===4){
    const k=w.order[w.oi];const p=G.P[k];
    if(!w.cur){
      if(!p.pend.length){return hd+prog+`<p class="note">${esc(hn(k))}의 조우 카드를 모두 처리했어요.</p><div class="btns"><button class="btn go" data-act="vwRevNextP">${w.oi+1<w.order.length?'다음 플레이어':'라운드 마무리로'}</button></div>`}
      return hd+prog+`<p class="note"><b>${esc(hn(k))}</b> 앞의 조우 카드 ${p.pend.length}장을 한 장씩 공개해요.</p><div class="row">${pile(p.pend,'e','noop','받은 조우 카드')}</div><div class="btns"><button class="btn go" data-act="vwRev">다음 카드 공개</button></div>`}
    const ci=G.I[w.cur];const cm=meta(ci.cid);const isObl=C[ci.cid].kind==='obligation';
    const ownerK=isObl?G.P.findIndex(q=>HEROES[q.hid].oblCid===ci.cid):k;

    const OB=OBL[ci.cid];const oblHTML=OB?`<p class="note"><b>의무 카드</b>예요. ${esc(hn(ownerK>=0?ownerK:k))}이(가) 일상 형태로 뒤집을 수 있고, 하나를 고르세요.</p><div class="btns"><button class="btn go" data-act="vwRes" data-t="oblx-ex" ${ownerK>=0&&G.I[G.P[ownerK].id].ex?'disabled':''}>일상으로 뒤집고 ${esc(OB.who)} 소진 → 게임에서 제거</button><button class="btn" data-act="vwRes" data-t="oblx-alt">${esc(OB.alt)}</button></div>`:'';
    const sDef=w.sthr??((cm.start??0)*(cm.pp?N():1));
    return hd+prog+`<div class="cs"><div class="cs-img ${C[ci.cid].land?'land':''}"><button class="slot ${C[ci.cid].land?'land':''}" data-act="card" data-i="${w.cur}">${faceOf(ci.cid,ci.side)}</button></div><div class="cs-body">
      ${cardText(ci.cid,ci.side)}

    if(t.startsWith('obl-')){const ok=G.P.findIndex(q=>HEROES[q.hid].oblCid===cid);moveTo(c,t==='obl-discard'?'enc.discard':t==='obl-remove'?'removed':`p${ok>=0?ok:k}.play`)}
    else{setMeta(cid,'type',t);
      if(t==='minion')minionEnter(c,k);

      if(t==='side'){const m2=meta(cid);const st=w.sthr??((m2.start??0)*(m2.pp?N():1));moveTo(c,'sides');G.I[c].thr=st;if(w.sthr!=null&&!m2.pp)setMeta(cid,'start',st);
        if(cid==='spiderman-nem-highway-robbery'){hwEffect(c);toast('고속도로 강도 — 각 플레이어의 손에서 무작위로 1장씩 뒷면으로 놓았어요')}}}
    w.cur=null})},
  vwSurge(){act(()=>{dealEnc(G.vw.order[G.vw.oi],1,true)});toast('쇄도 — 조우 카드 1장을 더 받았어요. 이 카드를 처리한 뒤 이어서 공개해요')},
  vwRevNextP(){act(()=>{const w=G.vw;w.oi++;if(w.oi>=w.order.length)w.step=5})},
  vw5(){act(()=>{G.P.forEach((p,x)=>p.play.filter(i=>G.I[i].cid==='basic-nick-fury').forEach(i=>{moveTo(i,`p${x}.discard`);setTimeout(()=>toast('라운드 끝 — Nick Fury를 버렸어요'),400)}));endPhaseBuffs();const o=order();G.first=o[1]??o[0];G.round++;G.phase='player';G.formUsed={};G.once={};G.vw=null;G.view=G.first});closeSheet();toast(`라운드 ${G.round} 시작`)},

  sfN(d){const n=+d.n;const ids=Object.keys(HEROES);while(SF.players.length<n){const used=SF.players.map(p=>p.hid);const h=ids.find(x=>!used.includes(x));const ua=SF.players.map(p=>p.aspect);

/* ===== 추가 카드 효과 (She-Hulk · Iron Man · Black Panther · 공격 · 보호 · Klaw · Ultron · 모듈식) ===== */
const MOE=['mastersofevil-radioactive-man','mastersofevil-whirlwind','mastersofevil-tiger-shark','mastersofevil-melter'];
const HYDRA=['legionsofhydra-hydra-soldier','legionsofhydra-madame-hydra','rhino-e-hydra-mercenary','bombscare-hydra-bomber'];
const isDroneI=x=>{const i=G.I[x];return !!i&&(i.drone||i.cid==='ultron-e-advanced-ultron-drone')};
const dronesWith=k=>G.P[k].engaged.filter(isDroneI).length;
const anyDrone=()=>G.P.some(p=>p.engaged.some(isDroneI));
function dronePlus(){return (vcid()==='ultron-v-ultron-iii'?1:0)+G.vill.attach.filter(x=>G.I[x].cid==='ultron-e-upgraded-drones').length}
function em(iid){const i=G.I[iid];if(!i)return {};let m;
  if(i.drone){const b=dronePlus();m={type:'minion',sch:1,atk:1+b,hp:1+b,drone:true}}
  else{m=Object.assign({},meta(i.cid));if(i.cid==='ultron-e-advanced-ultron-drone'&&vcid()==='ultron-v-ultron-iii'){m.atk=(m.atk||0)+1;m.hp=(m.hp||0)+1}}
  (i.att||[]).forEach(a=>{if(G.I[a].cid==='shehulk-nem-genetically-enhanced')m.hp=(m.hp||0)+3});
  if(i.cid==='shehulk-nem-titania'&&!i.drone)m.atk=Math.max(0,(m.hp||0)-i.dmg);
  return m}
const en=iid=>{const i=G.I[iid];if(!i)return '';return i.drone?'드론 (뒷면 카드)':nm(i.cid)};
function topCard(k){const p=G.P[k];if(!p.deck.length){if(!p.discard.length)return null;p.deck.push(...shuffle(p.discard.splice(0)));dealEnc(k,1);toast(`${hn(k)}: 덱이 다 떨어져 버린 카드 더미를 섞었어요. 조우 카드 1장을 받습니다.`)}return p.deck.pop()}
function millTop(k,n){const out=[];for(let x=0;x<n;x++){const c=topCard(k);if(!c)break;clean(c);G.P[k].discard.push(c);out.push(c)}return out}
const printedE=arr=>arr.reduce((s,x)=>s+(['e'].includes(resOf(G.I[x].cid))?resN(x):0),0);
function putDrone(k,n=1){let c2=0;const p=G.P[k];if(p.elim)return 0;for(let x=0;x<n;x++){const c=topCard(k);if(!c)break;clean(c);p.engaged.push(c);G.I[c].owner=k;G.I[c].drone=true;c2++}return c2}
function eachDrone(){const m=[];G.P.forEach((p,k)=>{if(!p.elim){const n=putDrone(k,1);if(n)m.push(hn(k))}});return m.length?`각 플레이어 덱 맨 위 카드를 드론으로 내려놓았어요`:''}
function searchEnc(cid){return G.enc.deck.find(x=>G.I[x].cid===cid)||G.enc.discard.find(x=>G.I[x].cid===cid)||null}
const inPlayEnemy=cid=>G.P.some(p=>p.engaged.some(x=>G.I[x].cid===cid&&!G.I[x].drone));
function digMinion(k,flt){const lim=G.enc.deck.length+G.enc.discard.length+1;const out=[];
  for(let x=0;x<lim;x++){const c=encTop();if(!c)break;const cid=G.I[c].cid;const ok=meta(cid).type==='minion'&&(!flt||flt(cid));
    if(ok){minionEnter(c,k,true);return `${nm(cid)}을(를) 찾아 ${hn(k)}와 교전시켰어요${out.length?` (버린 카드 ${out.length}장)`:''}`}
    G.enc.discard.push(c);out.push(c)}
  return '조건에 맞는 하수인을 찾지 못했어요'}
function attachMinion(m,c){pull(c);clean(c);const mi=G.I[m];mi.att=mi.att||[];mi.att.push(c)}
function highestMinion(excl){let best=null,bh=-1;G.P.forEach(p=>p.engaged.forEach(x=>{const ii=G.I[x];if(ii.drone)return;if(excl&&(ii.att||[]).some(a=>G.I[a].cid===excl))return;const h=meta(ii.cid).hp||0;if(h>bh){bh=h;best=x}}));return best}
function hitEnemy(iid,v,o={}){const ti=G.I[iid];if(!ti||v<=0)return {dead:false};const name=en(iid);
  if(ti.cid==='legionsofhydra-madame-hydra'&&!ti.drone&&G.sides.some(x=>G.I[x].cid==='legionsofhydra-legions-of-hydra')){toast('하이드라 군단이 있는 동안 Madame Hydra는 피해를 입지 않아요');return {dead:false,blocked:true}}
  if(o.bp&&ti.cid==='blackpanther-nem-killmonger'){toast('Killmonger는 블랙 팬서 업그레이드로부터 피해를 입지 않아요');return {dead:false,blocked:true}}
  if(ti.st.tough){ti.st.tough=0;toast(`${name}: 강인함 카드로 피해가 막혔어요`);return {dead:false}}
  ti.dmg+=v;const hp=em(iid).hp;
  if(hp&&ti.dmg>=hp){const bio=(ti.att||[]).find(a=>G.I[a].cid==='doomsdaychair-biomechanical-upgrades');
    if(bio){ti.dmg=0;ti.att=ti.att.filter(a=>a!==bio);G.enc.discard.push(bio);toast('생체역학적 향상 — 격파 대신 피해를 모두 치료하고 버렸어요');return {dead:false}}
    const over=ti.dmg-hp;defeatEnemy(iid);toast(`${name} 격파!`);return {dead:true,over}}
  return {dead:false}}
function eachEnemy(v,o={}){dmgVillain(v);G.P.forEach(p=>p.engaged.slice().forEach(x=>hitEnemy(x,v,o)))}
function vRetal(){return G.vill.attach.reduce((s,x)=>s+(meta(G.I[x].cid).retal||0),0)}
function heroAtk(k,val,name,extra={}){const idi=G.I[G.P[k].id];if(idi.st.stun){idi.st.stun=0;toast('기절 상태라 공격 대신 기절 카드를 버렸어요');return false}qpush(Object.assign({t:'tg',src:'e:'+k,kind:'atk',val,name,att:true},extra));return true}
function heroThw(k,val,name,extra={}){const idi=G.I[G.P[k].id];if(idi.st.conf){idi.st.conf=0;toast('혼란 상태라 저지 대신 혼란 카드를 버렸어요');return false}qpush(Object.assign({t:'tg',src:'e:'+k,kind:'thw',val,name},extra));return true}
const isTech=x=>!!(cdOf(G.I[x].cid)||{}).tech;

  const m=base.match(/^(.*?)(?:[_-]b)$/);if(m&&C[m[1]]&&C[m[1]].ds)return m[1]+'|b';
  if(C[base])return base+'|a';if(m&&C[m[1]])return m[1]+'|a';return null}
$('#filePick').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!UI.pickKey)return;
  toast('이미지를 넣는 중…');await putImg(UI.pickKey,f);toast('이미지를 넣었어요');render();drawSheet()});
$('#bulkPick').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';let ok=0,miss=[];
  toast('이미지를 넣는 중…');
  for(const f of files){
    if(/\.zip$/i.test(f.name)){if(!window.JSZip){toast('zip을 열 도구를 불러오지 못했어요. 이미지 파일을 직접 골라 주세요');continue}
      const z=await JSZip.loadAsync(f);for(const ent of Object.values(z.files)){if(ent.dir||!/\.(jpe?g|png|webp|gif|tiff?)$/i.test(ent.name))continue;const key=keyFromName(ent.name);
        if(!key){miss.push(ent.name.split('/').pop());continue}const b=await ent.async('blob');await putImg(key,b);ok++}}
    else{const key=keyFromName(f.name);if(!key){miss.push(f.name);continue}await putImg(key,f);ok++}
  }
  render();openSheet(()=>head('불러오기 결과')+`<p class="note">${ok}장을 자리에 넣었어요.${miss.length?` 이름이 맞지 않는 파일 ${miss.length}개는 건너뛰었어요.`:''}</p>${miss.length?`<p class="sub">${miss.slice(0,40).map(esc).join(', ')}${miss.length>40?' …':''}</p><p class="sub">이 파일들은 해당 카드를 눌러 하나씩 넣거나, 파일 이름 목록대로 이름을 바꿔 다시 넣어 주세요.</p>`:''}`)});

/* ---------- 이벤트 연결 ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t,e)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.meta){const [cid,k]=t.dataset.meta.split('|');let v=t.value;
    if(t.dataset.bool)v=v?true:null;else if(!t.dataset.text)v=v===''?null:+v;else v=v.trim()||null;
    setMeta(cid,k,v);
    if(G&&VIEW==='game'){const p=G.P.find(q=>HEROES[q.hid].identity===cid);if(p&&k==='hp'&&v!=null){p.hpMax=v}
      if(cid===vcid()&&k==='hp'&&v!=null&&G.vill.hp<=0)G.vill.hp=v*N();save()}
    if(VIEW==='setup'||VIEW==='lib'){render()}else{render();if(SH)drawSheet()}return}
  if(t.dataset.sf){const k=t.dataset.sf;
    if(t.dataset.k!=null){SF.players[+t.dataset.k][k]=t.value;if(k==='hid')SF.players[+t.dataset.k].aspect=HEROES[t.value].aspect}
    else if(k==='expert')SF.expert=t.value==='1';
    else{SF[k]=t.value;if(k==='scen')SF.mod=SCEN[t.value].mod}
    store.set('mct_setup',SF);render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet()});

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(async()=>{try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}await loadImgs();render();if(G&&VIEW==='game'&&G.setup)openSheet(setupSheet)})();
</script>
